<title>PaperBrief Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 760px column of sketch frames; copy kept to 1-2 word labels */
:root{
  --bg:#eef0f2; --paper:#ffffff; --ink:#1d232b; --muted:#6b7580; --line:#cfd5db; --fill:#e6e9ec;
  --accent:#2f5bd3; --ok:#2e7d4f; --warn:#b26a00; --bad:#b3261e;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181d; --paper:#1c2128; --ink:#e4e8ec; --muted:#98a2ac; --line:#38414b; --fill:#262d35;
  --accent:#7c9cf0; --ok:#6cc08f; --warn:#e0a24a; --bad:#ef7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d; --paper:#1c2128; --ink:#e4e8ec; --muted:#98a2ac; --line:#38414b; --fill:#262d35;
  --accent:#7c9cf0; --ok:#6cc08f; --warn:#e0a24a; --bad:#ef7b72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:40px}
h1{font:700 26px/1.2 var(--sans);margin:0}
h2{font:600 17px/1.3 var(--sans);margin:0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section{display:grid;gap:12px}
.frame{background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;min-width:0}
.top{display:grid;gap:10px;padding:12px 14px;border-bottom:1.5px solid var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.brand{font:700 15px var(--sans)}
button{font:inherit;color:inherit}
.btn{font:500 12px var(--sans);border:1.5px solid var(--ink);background:var(--paper);border-radius:4px;padding:3px 10px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.ghost{border:0;background:none;cursor:pointer;color:var(--muted);font:500 13px var(--mono);padding:2px 4px}
.ghost:hover{color:var(--ink)}
:is(.btn,.chip,.ghost,.tab,.card):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.date{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.tag{font:500 11px var(--mono);color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:0 5px}
.chip{font:500 12px var(--mono);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:transparent;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--fill)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.seg .chip{border:0;border-radius:0}
.card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.card:last-child{border-bottom:0}
.card:hover{background:var(--fill)}
.up{font:600 13px var(--mono);font-variant-numeric:tabular-nums;grid-row:span 3}
.t{font-weight:600;min-width:0}
.s{color:var(--muted);font-size:13px;grid-column:2}
.m{font:12px var(--mono);color:var(--muted);grid-column:2}
.side{grid-row:1;grid-column:3;font:500 12px var(--mono);display:flex;gap:8px;align-items:center}
.ok{color:var(--ok)}.run{color:var(--warn)}.bad{color:var(--bad)}
.muted{color:var(--muted)}
.rhead{display:grid;gap:4px;padding:12px 14px;border-bottom:1.5px solid var(--ink)}
.rhead .t{font-size:16px}
.rbody{padding:16px 14px;display:grid;gap:14px}
.hook{font-weight:600}
.img{aspect-ratio:16/7;max-width:100%;border:1.5px solid var(--ink);border-radius:4px;background:
  linear-gradient(to top right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),
  linear-gradient(to top left,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),var(--fill)}
.cap{font-size:12px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;font-size:14px;margin:0}
.kv dt{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0}
.repro{display:flex;flex-wrap:wrap;gap:4px 12px}
.repro button{border:0;background:none;padding:0;cursor:pointer;font:13px var(--sans)}
.why{font-size:12px;color:var(--muted)}
.status{padding:28px 14px;font:13px var(--mono);color:var(--muted)}
.ask{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0;font:14px var(--sans);border:1.5px solid var(--ink);border-radius:4px;padding:6px 8px;background:var(--paper);color:var(--ink)}
.foot{font:11px var(--mono);color:var(--muted);padding:0 14px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:500 12px var(--mono);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:3px 10px;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.empty{padding:40px 14px;display:grid;gap:10px;justify-items:center;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.alert{display:flex;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--bad);color:var(--bad);font-size:13px}
.flow{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto}
.spin{display:inline-block}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
</style>

<div class="wrap">
  <header style="display:grid;gap:6px">
    <div class="eyebrow">brief.md</div>
    <h1>PaperBrief 와이어프레임</h1>
  </header>

  <section>
    <div class="eyebrow">Flow</div>
    <div class="flow" style="background:#fff;text-align:center">

<script>
const PAPERS=[
 {up:160,cats:["cs.CV"],code:true,t:"OneStreamer: Unifying Perception, Memory, and Proactive Response in Streaming Video Interaction",ko:"스트리밍 비디오 LLM의 인식·기억·응답 통합",en:"Unifies perception, memory and proactive response for streaming video.",org:"Nanjing University",st:"done"},
 {up:148,cats:["cs.CL","cs.LG","cs.AI"],code:true,t:"Hierarchical Continuous Diffusion Language Models",ko:"연속 확산 언어 모델을 계층 구조로 확장",en:"Extends continuous diffusion language models to a hierarchy.",org:"",st:"run"},
 {up:117,cats:["cs.LG"],code:false,t:"On-Policy or Off-Policy Learning? A Systematic Study of Distillation Dynamics",ko:"증류에서 on-policy와 off-policy 비교",en:"Compares on-policy and off-policy learning in distillation.",org:"",st:""},
 {up:96,cats:["cs.CL"],code:false,t:"GraphForge: Training Working Agents with Graph-Anchored Workspace Synthesis",ko:"그래프 기반 작업 공간 합성으로 에이전트 학습",en:"Trains working agents with graph-anchored workspaces.",org:"",st:"fail"},
 {up:88,cats:["cs.CV"],code:false,t:"Adaptive Reward Routing for Joint Audio-Video Diffusion via Forward-Process RL",ko:"오디오·비디오 확산에 보상 라우팅 RL",en:"Reward routing RL for joint audio-video diffusion.",org:"",st:""}
];
const DOT={done:'<span class="ok">●</span>',run:'<span class="run">◐</span>',fail:'<span class="bad">✕</span>',"":""};
let filt="all",lang="ko",codeOnly=false;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderList(){
  const rows=PAPERS.filter(p=>(filt==="all"||p.cats.includes(filt))&&(!codeOnly||p.code)).sort((a,b)=>b.up-a.up||(b.code-a.code));
  document.getElementById("count").textContent=rows.length;
  const el=document.getElementById("list");
  if(!rows.length){el.innerHTML='<div class="empty"><span>결과 없음</span><button class="btn" type="button" id="reset">초기화</button></div>';return}
  el.innerHTML=rows.map(p=>`<button class="card" type="button"><span class="up">▲${p.up}</span><span class="t">${esc(p.t)}</span>
   <span class="side">${p.code?'<span title="코드 있음">&lt;/&gt;</span>':""}${DOT[p.st]}</span>
   <span class="s">${esc(lang==="ko"?p.ko:p.en)}</span>
   <span class="m">${p.cats.map(c=>c.split(".")[1]).join(" ")}${p.org?" · "+esc(p.org):""}</span></button>`).join("");
}
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.id==="codeOnly"){codeOnly=!codeOnly;b.classList.toggle("on",codeOnly);b.setAttribute("aria-pressed",String(codeOnly))}
  else if(b.dataset.l){lang=b.dataset.l;document.querySelectorAll("#lang .chip").forEach(c=>c.classList.toggle("on",c===b))}
  else{filt=b.dataset.f;document.querySelectorAll("#filters .chip[data-f]").forEach(c=>c.classList.toggle("on",c===b))}
  renderList();
});

 run:`<div class="status"><span class="spin">⟳</span> 파싱 중… 0:41</div>`,
